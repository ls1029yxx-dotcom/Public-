function options(values,value,labels){return '<option value="">全部</option>'+values.map(v=>`<option value="${v}" ${v===value?'selected':''}>${labels?labels[v]:v}</option>`).join('')}
function layout(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page==='games'));$('#page-title').textContent='游戏管理';$('#workspace').innerHTML=`<div class="breadcrumb">工作台 &nbsp; / &nbsp; <b>游戏管理</b></div><div class="intro"><div><h2>游戏内容管理</h2><p>统一处理游戏审核与上下架，管理内容状态及操作记录</p></div><span class="demo-tag">交互演示 · 本地数据</span></div><div class="audit-tabs" role="tablist" aria-label="游戏管理功能">${[['queue','游戏列表'],['logs','操作日志']].map(([key,label])=>`<button role="tab" aria-selected="${auditTab===key}" data-audit-tab="${key}" class="${auditTab===key?'active':''}">${label}</button>`).join('')}</div>${auditTab==='queue'?gameList():records()}<div class="bottom-note">所有操作仅保存在当前浏览器 · 演示数据，不影响真实平台</div>`}
function gameList(){return `<form class="panel filters" id="filters"><div class="filter"><label for="text">游戏名称</label><input id="text" name="text" placeholder="请输入游戏名称" value="${safe(query.text)}"></div><div class="filter"><label for="category">游戏类别</label><select id="category" name="category">${options(['冒险','模拟经营','射击','休闲','竞速'],query.category)}</select></div><div class="filter"><label for="review">审核状态</label><select id="review" name="review">${options(Object.keys(reviewNames),query.review,reviewNames)}</select></div><div class="filter"><label for="shelf">上架状态</label><select id="shelf" name="shelf">${options(Object.keys(shelfNames),query.shelf,shelfNames)}</select></div><div class="filter-actions"><button class="primary" type="submit"><span class="search-icon">⌕</span>搜索</button><button class="secondary" type="button" data-action="reset">重置</button></div></form><section class="panel table-panel"><div class="table-heading"><strong>共 <b>${filtered().length}</b> 个游戏</strong></div><div class="table-scroll"><table><thead><tr>${['游戏图片','游戏名称','创作者账号','游戏类别','游戏链接','审核状态','上架状态','创建时间','更新时间','操作'].map(x=>timeHeader(x)).join('')}</tr></thead><tbody>${rows()}</tbody></table></div>${pagination(filtered().length)}</section>`}
function timeHeader(label){const key=label==='创建时间'?'created':label==='更新时间'?'updated':null;if(!key)return `<th>${label}</th>`;const active=sort.startsWith(key+'-'),direction=sort.endsWith('desc')?'descending':'ascending';return `<th aria-sort="${active?direction:'none'}"><button class="sort-head" data-sort-key="${key}" aria-label="${label}，${active?(direction==='descending'?'当前降序，点击升序':'当前升序，点击降序'):'点击降序'}">${label}<span class="sort-arrows" aria-hidden="true"><span class="${active&&direction==='ascending'?'active':''}">▴</span><span class="${active&&direction==='descending'?'active':''}">▾</span></span></button></th>`;}
function managementAction(g){if(g.review==='pending')return `<button class="primary" data-action="review" data-id="${g.id}">审核</button>`;if(g.shelf==='live')return `<button class="secondary" data-action="off" data-id="${g.id}">下架</button>`;if(canList(g))return `<button class="primary" data-action="on" data-id="${g.id}">上架</button>`;return `<button class="secondary waiting" disabled title="审核失败，不允许上架">上架</button>`;}
function rows(){const list=filtered();current=Math.max(1,Math.min(current,Math.ceil(list.length/pageSize)||1));return list.slice((current-1)*pageSize,current*pageSize).map(g=>`<tr><td>${thumb(g)}</td><td><strong>${safe(g.name)}</strong></td><td>${safe(g.creator)}</td><td>${g.category}</td><td><button class="link" data-action="preview" data-id="${g.id}">♧ 打开链接</button></td><td>${badge(g.review,'review')}</td><td>${badge(g.shelf,'shelf')}</td><td>${fmt(g.created)}</td><td>${fmt(g.updated)}</td><td class="action">${managementAction(g)}</td></tr>`).join('')||'<tr><td colspan="10"><div class="empty"><span>⌕</span>未找到匹配的游戏，请调整筛选条件</div></td></tr>'}
function pagination(total){const max=Math.max(1,Math.ceil(total/pageSize));return `<div class="pagination"><span>共 ${total} 条</span><button data-page-number="${current-1}" ${current<=1?'disabled':''} aria-label="上一页">‹</button>${Array.from({length:max},(_,i)=>`<button class="${current===i+1?'current':''}" data-page-number="${i+1}">${i+1}</button>`).join('')}<button data-page-number="${current+1}" ${current>=max?'disabled':''} aria-label="下一页">›</button><span>跳至</span><input id="jump" type="number" min="1" max="${max}" value="${current}" aria-label="跳转页码"><span>页</span></div>`}
function records(){const list=(auditTab==='reviews'?reviews:logs).filter(r=>!recordQuery||(r.name+' '+r.gameId+' '+r.detail+' '+(r.reason||'')).toLowerCase().includes(recordQuery.toLowerCase()));const selected=list.slice((current-1)*pageSize,current*pageSize);return `<div class="info-banner">${auditTab==='reviews'?'审核提交后会在此生成记录。下架游戏将进入重新审核流程。':'上架、下架与审核操作会自动写入日志，刷新页面后仍会保留。'}</div><section class="panel"><form id="record-search" class="record-filters"><input name="q" aria-label="搜索记录" placeholder="搜索游戏名称、ID 或操作内容" value="${safe(recordQuery)}"><button class="primary">搜索</button><span class="record-tag">${list.length} 条记录</span></form><div class="table-panel"><div class="table-scroll"><table><thead><tr>${(auditTab==='reviews'?['游戏名称（ID）','审核结果','原因 / 备注','审核人','审核时间']:['游戏名称（ID）','操作类型','操作详情','操作人','操作时间']).map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${selected.map(r=>`<tr><td><strong>${safe(r.name)}</strong><small>#${r.gameId}</small></td><td>${auditTab==='reviews'?badge(r.result,'review'):`<span class="badge ${r.action==='下架'?'pending':'pass'}">${r.action}</span>`}</td><td style="max-width:380px;white-space:normal;line-height:1.7">${safe(r.reason||r.detail||'—')}</td><td>${r.operator}</td><td>${fmt(r.time)}</td></tr>`).join('')||`<tr><td colspan="5"><div class="empty"><span>▤</span>${recordQuery?'未找到匹配记录':'暂无记录，完成游戏操作后将显示在这里'}</div></td></tr>`}</tbody></table></div>${pagination(list.length)}</div></section>`}
function openModal(title,body,footer='',className=''){const m=$('#modal');m.className=className;m.innerHTML=`<div class="modal-head">${title}<button class="close" data-action="close" aria-label="关闭">×</button></div>${body}${footer?`<div class="modal-foot">${footer}</div>`:''}`;if(!m.open)m.showModal()}
const cancel='<button class="secondary" data-action="close">取消</button>';
function openOff(g){activeGame=g;openModal('下架游戏',`<div class="modal-body"><div class="notice"><b>!</b><span>下架后，游戏将从平台公开列表移除，并自动进入重新审核流程（审核状态变为「审核中」）。</span></div><label class="field-title" for="off-reason">下架原因<span class="required">*</span></label><textarea id="off-reason" class="reason-input" maxlength="200" placeholder="请输入下架原因（必填），如：存在违规内容、体验问题等…"></textarea><div class="counter"><span id="count">0</span> / 200</div></div>`,cancel+'<button class="primary" id="confirm-off" data-action="confirm-off" disabled>确认下架</button>')}
function openOn(g){activeGame=g;openModal('上架游戏',`<div class="modal-body"><div class="confirm-intro"><span class="question">?</span><div><h3>确认上架该游戏吗？</h3><p>上架后，游戏将对平台用户公开可见。</p></div></div><div class="detail-row"><span>游戏名称</span><b>${safe(g.name)}（#${g.id}）</b></div><div class="detail-row"><span>当前状态</span><b>${reviewNames[g.review]} · ${shelfNames[g.shelf]}</b></div></div>`,cancel+'<button class="primary" data-action="confirm-on">确认上架</button>')}
function openReview(g){activeGame=g;reviewResult='pass';reviewReason='';previewIndex=0;renderReview()}
function renderReview(){const g=activeGame;openModal('游戏审核',`<div class="review-layout"><div class="review-left"><div class="review-overview"><div class="cover ${g.art}"><span>${g.emoji}</span></div><div class="review-info"><h3>${safe(g.name)} <small style="font-weight:400;color:#93a0b2">#${g.id}</small></h3><dl><dt>创作者账号</dt><dd>${safe(g.creator)}</dd><dt>游戏类别</dt><dd>${g.category}</dd><dt>游戏链接</dt><dd><button class="link" data-action="review-preview">♧ 打开游戏</button></dd><dt>提交时间</dt><dd>${fmt(g.updated)}</dd><dt>当前状态</dt><dd>${badge(g.review,'review')}</dd></dl></div></div><div class="preview-box"><div class="preview-caption"><span>游戏预览（<b id="preview-number">${previewIndex+1}</b>/5）</span><button data-action="enlarge" aria-label="放大预览">⛶</button></div><div class="preview-carousel"><button data-action="prev-image" aria-label="上一张图片">‹</button><div class="preview-images">${previewImages()}</div><button data-action="next-image" aria-label="下一张图片">›</button></div></div></div><div class="review-right"><h4>审核结果<span class="required">*</span></h4><div class="radios"><label class="radio-label"><input type="radio" name="result" value="pass" ${reviewResult==='pass'?'checked':''}>审核通过</label><label class="radio-label"><input type="radio" name="result" value="fail" ${reviewResult==='fail'?'checked':''}>审核失败</label></div><div id="reject-options">${reasonOptions()}</div></div></div>`,cancel+`<button class="primary" data-action="submit-review" id="submit-review" ${reviewResult==='fail'&&!reviewReason?'disabled':''}>提交审核</button>`,'review-modal')}
function reasonOptions(){return reviewResult==='pass'?'<div class="review-hint">✓ 审核通过后，游戏列表的上架按钮将开放，需确认后才会上架。<br>本次审核结果将同步写入操作日志。</div>':`<h4>失败原因模板<span class="required">*</span></h4>${rejection.map(([title,desc],i)=>`<label class="radio-label reason-option"><input type="radio" name="reason" value="${i}" ${reviewReason===title?'checked':''}><span><strong>${title}</strong><small>${desc}</small></span></label>`).join('')}<textarea id="review-comment" class="review-comment" maxlength="300" placeholder="补充说明（选填）"></textarea>`}
const sceneEmojis=['🏝️','🏡','🏖️','🌳','🏰'];function previewImages(){return Array.from({length:3},(_,k)=>{const i=(Math.floor(previewIndex/3)*3+k)%5;return `<button data-image="${i}" class="${i===previewIndex?'selected':''}" aria-label="预览图片 ${i+1}"><div class="thumb ${activeGame.art}"><span>${sceneEmojis[i]}</span></div></button>`}).join('')}
function updatePreview(){ $('.preview-images').innerHTML=previewImages();$('#preview-number').textContent=previewIndex+1;$('.review-overview .cover span').textContent=sceneEmojis[previewIndex]}
function gamePreview(g,fromReview=false){activeGame=g;previewScore=0;openModal(safe(g.name)+' · 游戏预览',`<div class="preview-content game-body"><div class="cover ${g.art}"><span>${g.emoji}</span></div><p>创作者 ${safe(g.creator)} · ${g.category} · #${g.id}<br>以下为可交互试玩占位，用于验证管理后台的预览入口。</p><div class="play-score">已收集 <b id="play-score">0</b> 颗星星</div><div class="demo-game"><button id="star" aria-label="收集星星" style="left:45%;top:35%">⭐</button></div><span class="label">点击星星即可收集 · 此演示不加载外部游戏</span></div>`,`<button class="secondary" data-action="${fromReview?'return-review':'close'}">${fromReview?'返回审核':'关闭预览'}</button>`,'game-preview')}
function close(){ $('#modal').close()}
function changePage(v){pageQueries[page]={...query};page=v;query=pageQueries[v]||{text:'',category:'',review:'',shelf:''};current=1;recordQuery='';layout();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.sortKey){const key=b.dataset.sortKey;sort=sort===key+'-desc'?key+'-asc':key+'-desc';current=1;layout();return}if(b.dataset.page){changePage(b.dataset.page);return}if(b.dataset.auditTab){auditTab=b.dataset.auditTab;current=1;recordQuery='';layout();return}if(b.dataset.pageNumber){const total=auditTab==='queue'?filtered().length:(auditTab==='reviews'?reviews:logs).filter(r=>!recordQuery||(r.name+' '+r.gameId+' '+r.detail+' '+(r.reason||'')).toLowerCase().includes(recordQuery.toLowerCase())).length;current=Math.max(1,Math.min(Number(b.dataset.pageNumber),Math.ceil(total/pageSize)||1));layout();return}if(b.dataset.image!==undefined){previewIndex=Number(b.dataset.image);updatePreview();return}const a=b.dataset.action,g=games.find(x=>x.id===Number(b.dataset.id));if(a==='close')close();if(a==='reset'){query={text:'',category:'',review:'',shelf:''};current=1;layout()}if(a==='off'&&page==='games'&&g?.shelf==='live')openOff(g);if(a==='on'&&page==='games'&&canList(g)&&g.shelf!=='live')openOn(g);if(a==='review'&&page==='games'&&g?.review==='pending')openReview(g);if(a==='preview')gamePreview(g);if(a==='confirm-off'&&page==='games'){const reason=$('#off-reason').value.trim();if(!reason)return;const g=activeGame;if(g.shelf!=='live')return;g.shelf='off';g.review='pending';g.requiresReaudit=true;g.updated=stamp();track(g,'下架','下架原因：'+reason+'；自动进入重新审核');close();layout();toast('游戏已下架，已进入重新审核流程')}if(a==='confirm-on'&&page==='games'){const g=activeGame;if(!canList(g)||g.shelf==='live')return;g.shelf='live';g.updated=stamp();track(g,'上架','审核通过，游戏已公开上架');close();layout();toast('游戏上架成功')}if(a==='submit-review'){if(reviewResult==='fail'&&!reviewReason)return;const g=activeGame;if(g.review!=='pending')return;const comment=$('#review-comment')?.value.trim();g.review=reviewResult;g.requiresReaudit=reviewResult!=='pass';g.updated=stamp();const reason=reviewResult==='fail'?reviewReason+(comment?'：'+comment:''):'审核通过';reviews.unshift({id:Date.now(),gameId:g.id,name:g.name,result:reviewResult,reason,operator:'管理员',time:stamp()});track(g,'审核',reviewNames[reviewResult]+'；'+reason);close();layout();toast('审核已提交：'+reviewNames[reviewResult])}if(a==='prev-image'||a==='next-image'){previewIndex=(previewIndex+(a==='next-image'?1:4))%5;updatePreview()}if(a==='review-preview')gamePreview(activeGame,true);if(a==='return-review')renderReview();if(a==='enlarge'){openModal('游戏预览 · '+(previewIndex+1)+'/5',`<div class="modal-body full-preview"><div class="cover ${activeGame.art}"><span>${sceneEmojis[previewIndex]}</span></div></div>`,'<button class="secondary" data-action="return-review">返回审核</button>','game-preview')}if(b.id==='star'){previewScore++;$('#play-score').textContent=previewScore;b.style.left=(5+Math.random()*75)+'%';b.style.top=(5+Math.random()*60)+'%'}if(b.id==='admin')openModal('管理员信息','<div class="modal-body profile-popover"><b>管理员</b><p>角色：内容审核与运营管理</p><p>权限：游戏审核、上下架、查看操作记录</p><p style="color:#8a99af">当前为本地交互 Demo，无真实账号或登录服务。</p></div>','<button class="primary" data-action="close">知道了</button>');});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='filters'){const f=new FormData(e.target);query={text:f.get('text').trim(),category:f.get('category'),review:f.get('review'),shelf:f.get('shelf')};current=1;layout()}if(e.target.id==='record-search'){recordQuery=new FormData(e.target).get('q').trim();current=1;layout()}});
document.addEventListener('input',e=>{if(e.target.id==='off-reason'){$('#count').textContent=e.target.value.length;$('#confirm-off').disabled=!e.target.value.trim()}if(e.target.id==='jump')e.target.value=e.target.value.replace(/[^0-9]/g,'')});
document.addEventListener('change',e=>{if(e.target.name==='result'){reviewResult=e.target.value;reviewReason='';$('#reject-options').innerHTML=reasonOptions();$('#submit-review').disabled=reviewResult==='fail'}if(e.target.name==='reason'){reviewReason=rejection[Number(e.target.value)][0];$('#submit-review').disabled=false}if(e.target.id==='jump'){const max=Number(e.target.max);current=Math.max(1,Math.min(Number(e.target.value)||1,max));layout()}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))close()});document.addEventListener('keydown',e=>{if(e.target.id==='jump'&&e.key==='Enter'){e.preventDefault();e.target.dispatchEvent(new Event('change',{bubbles:true}))}});layout();
</script></body></html>
